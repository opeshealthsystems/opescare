openapi: 3.1.0
info:
  title: OpesCare Connect API
  version: "1.1.0"
  description: |
    OpesCare's interoperability API suite — enabling hospitals, pharmacies,
    labs, insurers, and third-party systems to securely access and push
    patient health data with full consent and audit controls.

    **Paths are absolute and exact.** Every path in this document is the real,
    registered route (verified by an automated contract test —
    `tests/Feature/Architecture/OpenApiContractTest.php` — which fails CI if any
    documented path does not resolve to a live route). The `servers` URL is the
    bare host; paths include the full `/api/v1/...` prefix.

    **Coverage.** This is a *verified subset* of the platform's ~590 API routes:
    the OAuth/discovery surface, clinical encounter writes, B2B record push, and
    the Bridge Agent. Remaining endpoints are tracked in the migration backlog;
    they are intentionally absent rather than documented inaccurately.

    **Authentication:**
    - `client_credentials` → RS256 Bearer JWT (1 hour TTL) for Connect data routes
    - B2B header auth → `X-Client-ID` + `X-Client-Secret` (clinical encounter + introspection)
    - Bridge Agent → `X-Bridge-Agent-ID` + `X-Bridge-Agent-Key`

    **Token verification:** Access tokens are RS256 JWTs. Fetch the public key
    from `/.well-known/jwks.json` (the token header `kid` selects the key) and
    verify offline, or call `/api/v1/connect/auth/introspect`. See
    `docs/API-OAUTH.md`.

  contact:
    name: OpesCare Developer Support
    email: developer-support@opescare.com
  license:
    name: Proprietary

servers:
  - url: http://opescare.test
    description: Sandbox / Local Dev
  - url: https://sandbox-api.opescare.com
    description: Sandbox (Cloud)
  - url: https://api.opescare.com
    description: Production (requires approved account)

tags:
  - name: OAuth
    description: Token issuance and introspection (RFC 6749, RFC 7662)
  - name: Discovery
    description: Public OAuth/JWKS discovery documents (RFC 7517, RFC 8414)
  - name: Encounters
    description: Clinical encounter documentation (notes, allergies, diagnoses)
  - name: Records
    description: B2B record push (encounters, lab results, prescriptions)
  - name: Bridge
    description: On-premise Bridge Agent synchronisation

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 JWT issued by POST /api/v1/connect/auth/token (client_credentials).
        Expires in 3600 s. Cache and reuse — do not request a new token per call.
    ClientId:
      type: apiKey
      in: header
      name: X-Client-ID
      description: B2B integration client id. Send together with X-Client-Secret.
    ClientSecret:
      type: apiKey
      in: header
      name: X-Client-Secret
      description: B2B integration client secret (verified server-side, Argon2id).
    BridgeAgentId:
      type: apiKey
      in: header
      name: X-Bridge-Agent-ID
      description: Bridge Agent identifier. Send together with X-Bridge-Agent-Key.
    BridgeAgentKey:
      type: apiKey
      in: header
      name: X-Bridge-Agent-Key
      description: Bridge Agent key, verified server-side against its SHA-256 hash.

  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: "error"
        error_code:
          type: string
          example: "VALIDATION_FAILED"
        message:
          type: string
          example: "The request data failed validation."

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 3600
        scope:
          type: string
          example: "patients labs"

    IntrospectionResponse:
      type: object
      description: RFC 7662 introspection result. Inactive tokens return only `{ "active": false }`.
      properties:
        active:
          type: boolean
          example: true
        token_type:
          type: string
          example: "Bearer"
        scope:
          type: string
          example: "patients labs"
        client_id:
          type: string
        sub:
          type: string
        aud:
          type: string
          example: "opescare-api"
        iss:
          type: string
          example: "opescare-connect"
        exp:
          type: integer
        iat:
          type: integer
        jti:
          type: string
        facility_id:
          type: string
          nullable: true
        environment:
          type: string
          nullable: true

    Jwk:
      type: object
      properties:
        kty:
          type: string
          example: "RSA"
        use:
          type: string
          example: "sig"
        alg:
          type: string
          example: "RS256"
        kid:
          type: string
          example: "hGsZnZEQqPJBZMyORzAm3w6g_WHQSCn2TLQQMU29F80"
        n:
          type: string
          description: base64url RSA modulus
        e:
          type: string
          example: "AQAB"

    Jwks:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'

    OAuthServerMetadata:
      type: object
      description: RFC 8414 authorization server metadata.
      properties:
        issuer:
          type: string
          example: "https://api.opescare.com"
        token_endpoint:
          type: string
        introspection_endpoint:
          type: string
        jwks_uri:
          type: string
        grant_types_supported:
          type: array
          items:
            type: string
          example: ["client_credentials"]
        scopes_supported:
          type: array
          items:
            type: string
          example: ["patients", "subscriptions", "system", "labs", "prescriptions"]
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items:
            type: string
          example: ["RS256"]

    ClinicalNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visit_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, signed, amended]
        history_of_present_illness:
          type: string
          nullable: true
        examination_findings:
          type: string
          nullable: true
        treatment_plan:
          type: string
          nullable: true
        signed_at:
          type: string
          format: date-time
          nullable: true
        amends_note_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    AllergyRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
          nullable: true
        substance:
          type: string
        severity:
          type: string
          enum: [mild, moderate, severe, life_threatening]
        status:
          type: string
          example: "active"
        created_at:
          type: string
          format: date-time
          nullable: true

    Diagnosis:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        visit_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
          nullable: true
        display_name:
          type: string
        code_system:
          type: string
          enum: ["ICD-10", "SNOMED", "other"]
        code:
          type: string
          nullable: true
        snomed_code:
          type: string
          nullable: true
        snomed_display:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, resolved, ruled_out]
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true

paths:
  /api/v1/connect/auth/token:
    post:
      tags: [OAuth]
      summary: Issue an access token (client_credentials)
      description: Exchange client credentials for an RS256 Bearer JWT. Rate limited (30/min/IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret, grant_type]
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                grant_type:
                  type: string
                  enum: [client_credentials]
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Missing or unsupported grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/connect/auth/introspect:
    post:
      tags: [OAuth]
      summary: Introspect a token (RFC 7662)
      description: |
        Validate a Connect access token. The endpoint is itself authenticated
        (X-Client-ID / X-Client-Secret). Returns the token claims when active,
        or `{ "active": false }` otherwise — never revealing why.
      security:
        - ClientId: []
          ClientSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Introspection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionResponse'
        '401':
          description: Missing client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /.well-known/jwks.json:
    get:
      tags: [Discovery]
      summary: JSON Web Key Set (RFC 7517)
      description: The active RSA public signing key. Cacheable (max-age 3600). Public.
      security: []
      responses:
        '200':
          description: JWK Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

  /.well-known/oauth-authorization-server:
    get:
      tags: [Discovery]
      summary: Authorization server metadata (RFC 8414)
      description: Public discovery document advertising the token, introspection and JWKS endpoints.
      security: []
      responses:
        '200':
          description: Server metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthServerMetadata'

  /api/v1/encounters/notes:
    post:
      tags: [Encounters]
      summary: Save a clinical note (draft or signed)
      security:
        - ClientId: []
          ClientSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visit_id, provider_id]
              properties:
                visit_id:
                  type: string
                  format: uuid
                provider_id:
                  type: string
                  format: uuid
                history_of_present_illness:
                  type: string
                examination_findings:
                  type: string
                treatment_plan:
                  type: string
                status:
                  type: string
                  enum: [draft, signed]
                actor_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Note saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ClinicalNote'

  /api/v1/encounters/notes/{note}:
    get:
      tags: [Encounters]
      summary: Retrieve a clinical note
      security:
        - ClientId: []
          ClientSecret: []
      parameters:
        - name: note
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The note
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ClinicalNote'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/encounters/notes/{note}/amend:
    post:
      tags: [Encounters]
      summary: Amend a signed clinical note
      description: Creates a new signed note linked to the original via amends_note_id; the original is marked amended.
      security:
        - ClientId: []
          ClientSecret: []
      parameters:
        - name: note
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amendment_reason]
              properties:
                history_of_present_illness:
                  type: string
                examination_findings:
                  type: string
                treatment_plan:
                  type: string
                amendment_reason:
                  type: string
                  minLength: 10
                  maxLength: 1000
                actor_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Amended
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ClinicalNote'
                  original_note_id:
                    type: string
                    format: uuid
        '422':
          description: Amendment rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/encounters/allergies:
    post:
      tags: [Encounters]
      summary: Record a patient allergy
      security:
        - ClientId: []
          ClientSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, substance]
              properties:
                patient_id:
                  type: string
                  format: uuid
                substance:
                  type: string
                  maxLength: 255
                severity:
                  type: string
                  enum: [mild, moderate, severe, life_threatening]
                actor_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Allergy recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AllergyRecord'

  /api/v1/encounters/diagnoses:
    post:
      tags: [Encounters]
      summary: Record a diagnosis (ICD-10 / SNOMED)
      security:
        - ClientId: []
          ClientSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, visit_id, display_name]
              properties:
                patient_id:
                  type: string
                  format: uuid
                visit_id:
                  type: string
                  format: uuid
                display_name:
                  type: string
                  maxLength: 255
                code_system:
                  type: string
                  enum: ["ICD-10", "SNOMED", "other"]
                code:
                  type: string
                  maxLength: 50
                status:
                  type: string
                  enum: [active, resolved, ruled_out]
                is_primary:
                  type: boolean
                actor_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Diagnosis recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Diagnosis'

  /api/v1/connect/records/encounters:
    post:
      tags: [Records]
      summary: Push an external encounter (B2B)
      description: |
        Idempotent (require an `Idempotency-Key` header). Requires a consent
        grant covering `patients:write`. Unmatched patients return 202 with a
        reconciliation case id.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [health_id, external_encounter_id]
              properties:
                health_id:
                  type: string
                  example: "OC-CMR-XXXX-XXXX"
                external_encounter_id:
                  type: string
                encounter:
                  type: object
                  properties:
                    chief_complaint:
                      type: string
                    diagnoses:
                      type: array
                      items:
                        type: object
                        properties:
                          system:
                            type: string
                          code:
                            type: string
                          display:
                            type: string
      responses:
        '200':
          description: Accepted and synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "accepted"
                  opescare_record_id:
                    type: string
                  sync_status:
                    type: string
                  timeline_event_id:
                    type: string
        '202':
          description: Pending reconciliation (patient not matched)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "pending_reconciliation"
                  reconciliation_case_id:
                    type: string
                  message:
                    type: string
        '403':
          description: Facility context missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/connect/records/lab-results:
    post:
      tags: [Records]
      summary: Push an external lab result (B2B)
      description: Idempotent (`Idempotency-Key` header). Requires a consent grant covering `labs:write`.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [health_id, external_lab_order_id]
              properties:
                health_id:
                  type: string
                external_lab_order_id:
                  type: string
      responses:
        '200':
          description: Accepted and synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "accepted"
                  opescare_record_id:
                    type: string
                  sync_status:
                    type: string
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/connect/records/prescriptions:
    post:
      tags: [Records]
      summary: Push an external prescription (B2B)
      description: Idempotent (`Idempotency-Key` header). Requires a consent grant covering `prescriptions:write`.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [health_id, medication]
              properties:
                health_id:
                  type: string
                medication:
                  type: string
      responses:
        '200':
          description: Accepted and synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "accepted"
                  opescare_record_id:
                    type: string
                  sync_status:
                    type: string
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/bridge/sync:
    post:
      tags: [Bridge]
      summary: Submit a sync batch
      security:
        - BridgeAgentId: []
          BridgeAgentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sync_type, records]
              properties:
                sync_type:
                  type: string
                  enum: [ehr_records, lab_results, appointments, billing, pharmacy_stock, blood_stock]
                records:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                checksum:
                  type: string
                  minLength: 64
                  maxLength: 64
      responses:
        '201':
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                  status:
                    type: string
                    example: "completed"
                  sync_type:
                    type: string
                  inserted:
                    type: integer
                  updated:
                    type: integer
                  skipped:
                    type: integer
                  errors:
                    type: integer
                  synced_at:
                    type: string
                    format: date-time
        '500':
          description: Processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/bridge/heartbeat:
    post:
      tags: [Bridge]
      summary: Agent heartbeat
      security:
        - BridgeAgentId: []
          BridgeAgentKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  maxLength: 20
                hostname:
                  type: string
                  maxLength: 150
                capabilities:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  agent_id:
                    type: string
                  facility_id:
                    type: string
                  server_time:
                    type: string
                    format: date-time

  /api/v1/bridge/status:
    get:
      tags: [Bridge]
      summary: Agent status and recent batches
      security:
        - BridgeAgentId: []
          BridgeAgentKey: []
      responses:
        '200':
          description: Agent status
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id:
                    type: string
                  facility_id:
                    type: string
                  agent_status:
                    type: string
                  last_sync_at:
                    type: string
                    format: date-time
                    nullable: true
                  last_seen_at:
                    type: string
                    format: date-time
                    nullable: true
                  recent_batches:
                    type: array
                    items:
                      type: object
