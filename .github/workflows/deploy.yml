name: Deploy to Production

on:
  push:
    branches: [main]
    # Docs / SDKs / mobile / on-prem agent / tooling never affect the deployed
    # Laravel API host — skip the production deploy when a push touches ONLY these.
    # (workflow_dispatch below still allows a manual deploy any time.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'sdk/**'
      - 'widget/**'
      - 'apps/mobile-expo/**'
      - 'bridge-agent/**'
      - '.gstack/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '.superpowers/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a running deploy

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opescare_test
          POSTGRES_USER: opescare
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, redis, mbstring, xml, bcmath, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: apps/api-laravel/vendor
          key: composer-${{ hashFiles('apps/api-laravel/composer.lock') }}

      # Dev dependencies are REQUIRED here: phpunit and nunomaduro/collision are
      # require-dev, and `php artisan test` is registered by Collision. With
      # --no-dev this step could never run a test — it failed before collecting
      # one, and because `deploy` needs this job, no deploy has ever run from
      # this workflow. The production install on the server stays --no-dev.
      - name: Install dependencies
        working-directory: apps/api-laravel
        run: composer install --optimize-autoloader --no-interaction

      - name: Setup .env
        working-directory: apps/api-laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=opescare_test" >> .env
          echo "DB_USERNAME=opescare" >> .env
          echo "DB_PASSWORD=secret" >> .env
          echo "CACHE_STORE=redis" >> .env
          echo "QUEUE_CONNECTION=redis" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env

      # Cheap, no database, and it fails in about a second - so it runs
      # before migrations. This is a hard gate because it has already been
      # missed once: lang/fr/api.php sat double-encoded in production and
      # the audit was green throughout, because it only compared KEYS. It
      # now also checks encoding and :placeholder parity - and it was never
      # wired into CI at all, the project checklist just asked a human to
      # remember to run it.
      - name: i18n parity, encoding and placeholder audit
        working-directory: apps/api-laravel
        run: php scripts/i18n-audit.php

      - name: Run migrations
        working-directory: apps/api-laravel
        run: php artisan migrate --force

      # Serial, deliberately. `--parallel` was the gate here and it could never
      # have passed: brianium/paratest was not a dependency, so the step died
      # with Collision's RequirementsException before running a single test —
      # and `deploy` needs this job, so no deploy has run from this workflow.
      #
      # Paratest is installed now, but parallel still is not viable: it gives
      # each worker its own database and RefreshDatabase then drops all 523
      # tables in one transaction, which blows past Postgres's default
      # max_locks_per_transaction (64) with "out of shared memory". Tuning the
      # service container for a marginal speed win is not worth the fragility
      # in the one job that gates production.
      - name: Run tests
        working-directory: apps/api-laravel
        run: php artisan test

  deploy:
    name: Rolling Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rolling restart (zero-downtime)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST << 'ENDSSH'
            set -e
            cd $DEPLOY_PATH/apps/api-laravel

            # Enter maintenance mode BEFORE swapping code. New code on disk can
            # reference schema that migrations haven't applied yet (e.g. a column
            # added in this release) — serving traffic in that window causes 500s
            # and potential data errors. Maintenance mode returns 503 + Retry-After
            # instead, and we only lift it after migrations + caches + fpm reload.
            # (--secret lets the health check bypass the maintenance screen.)
            echo "==> Entering maintenance mode..."
            php artisan down --retry=15 --secret="${DEPLOY_HEALTHCHECK_SECRET:-deploy-healthcheck}" || true

            echo "==> Pulling latest code..."
            git pull origin main --ff-only

            echo "==> Installing/updating dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "==> Tagging Sentry release with deployed commit..."
            DEPLOY_SHA=$(git rev-parse --short HEAD)
            if grep -q '^SENTRY_RELEASE=' .env; then
              sed -i "s|^SENTRY_RELEASE=.*|SENTRY_RELEASE=${DEPLOY_SHA}|" .env
            else
              echo "SENTRY_RELEASE=${DEPLOY_SHA}" >> .env
            fi

            # Migrations run FIRST, while in maintenance mode, so the schema is
            # always up to date before any new-code path can be served.
            echo "==> Running migrations (forward-only, before traffic resumes)..."
            php artisan migrate --force

            echo "==> Asserting production configuration..."
            php artisan config:assert-production

            echo "==> Caching config, routes, views..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "==> Restarting queue workers gracefully..."
            php artisan queue:restart

            echo "==> Restarting Horizon..."
            php artisan horizon:terminate
            sleep 3

            echo "==> Reloading PHP-FPM..."
            sudo systemctl reload php8.3-fpm

            # Health check via the maintenance bypass secret, BEFORE lifting
            # maintenance — so we never expose a broken release to users.
            echo "==> Health check (maintenance bypass)..."
            curl -sf -H "Cookie: laravel_maintenance=${DEPLOY_HEALTHCHECK_SECRET:-deploy-healthcheck}" \
              http://localhost/api/health \
              || curl -sf "http://localhost/${DEPLOY_HEALTHCHECK_SECRET:-deploy-healthcheck}" \
              || (echo "Health check FAILED — staying in maintenance mode for investigation" && exit 1)

            echo "==> Lifting maintenance mode..."
            php artisan up

            echo "==> Deploy complete ✓"
          ENDSSH

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deploy FAILED for commit ${{ github.sha }}" >&2
          # Add Slack/PagerDuty webhook here via secrets.ALERT_WEBHOOK
